# Generated by scripts/build-seed.mjs from scripts/legacy/*. Initial seed only:
# after seeding, edit content in the admin console (versioned in the database).
tone: Warm, specific, never guilt-inducing. No shaming for missed days or broken streaks.
time_of_day:
  - before_hour: 12
    text: Good morning
  - before_hour: 18
    text: Good afternoon
  - before_hour: 24
    text: Good evening
greeting:
  headline: "{time_of_day}{name_suffix}! 👋"
  streak_active: You’re on a {streak}-day streak. Let’s keep it going.
  streak_none: Today is a great day to start a streak.
  revisions_due_one: 🔁 1 topic is due for revision (5–7 day rule). A quick review locks it in.
  revisions_due_many: 🔁 {count} topics are due for revision (5–7 day rule). A quick review locks them in.
  next_topic: "Suggested next: {topic}. One focused hour is plenty."
  all_touched: You’ve touched every topic, so now it’s all about revision and mock practice.
  footer: You’re preparing as a {level_name}. You’ve got this.
topic_done_cheers:
  - Every topic you finish is one fewer surprise in the interview. Nice work!
  - You’re building real depth, not just memorising. Keep going!
  - Small, steady sessions beat last-minute cramming. You’re doing it right.
  - Progress isn’t always loud, but yours is adding up.
closing:
  summary_with_minutes: You studied for {minutes} min this time.
  summary_no_minutes: Every visit counts.
  totals: "Total: {topics_done} topics done, {hours} h studied."
  farewells:
    - Great session. Rest well, your brain files this away while you sleep.
    - You showed up today, and that’s what separates prepared candidates from the rest.
    - Proud of the effort. Come back tomorrow and keep the streak alive!
    - Every hour here is an hour of confidence you’ll feel in the room. See you soon.
toasts:
  session_started: Session started. Let’s make it count!
  session_saved: Saved {minutes} min. Great focus!
  session_paused: Session paused
  revised: Revised, nicely done
  note_saved: Note saved
  attachment_added: Attachment added
  badge_unlocked: "{icon} Badge unlocked: {name}"
  level_up: Level up! {title}
  xp_gain: +{points} XP
