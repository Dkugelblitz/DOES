# Generated by scripts/build-seed.mjs from scripts/legacy/*. Initial seed only:
# after seeding, edit content in the admin console (versioned in the database).
answer_framework:
  min_level: 1
  total_minutes: 40
  steps:
    - step: Requirements, scale, SLAs
      minutes: 5
    - step: High-level data flow
      minutes: 10
    - step: Deep dive on 2 components
      minutes: 15
    - step: Failure modes, reliability, backfill
      minutes: 5
    - step: Governance, security, cost, trade-offs
      minutes: 5
designs:
  - id: medallion-lakehouse
    title: Medallion lakehouse (batch + stream)
    min_level: 1
    topics:
      - architecture/medallion-lakehouse
    points:
      - "Clarify: volume, freshness SLA, consumers, data contracts"
      - Bronze raw append (Auto Loader) → Silver cleaned/deduped (MERGE, expectations) → Gold marts
      - Unity Catalog per layer/domain, lineage, row/column security
      - "Reliability: checkpoints, idempotent writes, replay from bronze, quarantine table"
      - "Cost: job clusters/serverless, OPTIMIZE schedule, liquid clustering"
    order: 1
  - id: cdc-from-oltp-to-delta-with-scd2
    title: CDC from OLTP to Delta with SCD2
    min_level: 2
    topics:
      - architecture/cdc-pipeline-design
      - databricks/cdc
    points:
      - Log-based CDC (Debezium/DMS) → Kafka/S3 → bronze with op + ordering key
      - "Silver: MERGE or APPLY CHANGES, sequence by commit LSN/timestamp"
      - "Late/out-of-order: sequence column, watermark, backfill via replay"
      - "Deletes: soft delete or deletion vectors; schema drift: rescue column"
      - "Validate: row counts, checksums, reconciliation job"
    order: 2
  - id: real-time-fraud-analytics-pipeline
    title: Real-time fraud / analytics pipeline
    min_level: 3
    topics:
      - architecture/real-time-analytics-platform
    points:
      - Events → Kafka/Kinesis → Structured Streaming (stateful, watermark)
      - "Features: windowed aggregates; low-latency store (online feature store/DynamoDB)"
      - "Scoring: model serving endpoint with p99 budget; fallback rules"
      - Exactly-once sink, dead-letter queue, backpressure, autoscaling
      - "Observability: lag, latency, drift; offline reprocessing for audits"
    order: 3
  - id: enterprise-rag-copilot-platform
    title: Enterprise RAG copilot platform
    min_level: 3
    topics:
      - architecture/rag-platform-design
      - gen-ai/rag-architecture
    points:
      - Ingest connectors → parse → chunk → embed → vector index (+ keyword) with ACL metadata
      - "Query: auth, rewrite, hybrid retrieve, rerank, grounded prompt with citations"
      - "Security: per-user ACL filtering at retrieval, PII redaction, prompt-injection defenses"
      - Evals and feedback loop, caching, model routing, cost per query
      - "Freshness: incremental re-index on source change"
    order: 4
  - id: governed-multi-tenant-data-platform
    title: Governed multi-tenant data platform
    min_level: 3
    topics:
      - architecture/multi-tenant-governed-platform
    points:
      - "Isolation model: workspace/catalog per domain or tenant; shared metastore"
      - Central governance in Unity Catalog, tags, data classification, audit logs
      - "Network: private link, VPC endpoints, customer-managed keys"
      - "Compute governance: cluster policies, budgets, tagging for chargeback"
      - CI/CD with IaC, environments, data quality and SLA monitoring
    order: 5
  - id: ai-interviewer-pipeline
    title: AI interviewer pipeline (reported HackerRank question)
    min_level: 3
    topics:
      - hackerrank-ai-era/ai-interviewer-resume-deep-dive
    points:
      - Generate role-appropriate questions from resume + job description
      - Real-time speech → transcription → LLM follow-ups with low latency
      - Score free-form answers against a rubric; calibrate, audit for bias
      - Storage, privacy, consent; human review of borderline cases
    order: 6
