cards:
  - id: databricks-delta-transaction-log
    deck: Databricks
    question: Delta transaction log?
    answer: "_delta_log holds ordered JSON commits plus Parquet checkpoints. A snapshot is checkpoint + later commits. Writers use optimistic concurrency: validate no conflicting commit, else retry/fail."
    topic: databricks/transaction-log-delta-log
    min_level: inherit
    order: 1
  - id: databricks-fix-the-small-file-problem
    deck: Databricks
    question: Fix the small-file problem?
    answer: OPTIMIZE (bin-packing), optimized writes + auto compaction, then liquid clustering or Z-ORDER for data skipping.
    topic: databricks/optimize
    min_level: inherit
    order: 2
  - id: databricks-liquid-clustering-vs-partitioning-z-orde
    deck: Databricks
    question: Liquid clustering vs partitioning + Z-ORDER?
    answer: Liquid clustering is incremental, keys can change without rewriting, and it handles skew and high cardinality. Use it for new tables; partition only huge, low-cardinality data.
    topic: databricks/liquid-clustering
    min_level: inherit
    order: 3
  - id: databricks-vacuum-and-time-travel
    deck: Databricks
    question: VACUUM and time travel?
    answer: VACUUM deletes unreferenced files older than retention (default 7 days), which shrinks the time-travel window. Never go below the longest reader or stream lag.
    topic: databricks/vacuum
    min_level: inherit
    order: 4
  - id: databricks-speed-up-merge
    deck: Databricks
    question: Speed up MERGE?
    answer: Prune with a partition/cluster predicate in ON, dedupe the source, enable deletion vectors, avoid broad updates.
    topic: databricks/merge-scd1-scd2-cdc
    min_level: inherit
    order: 5
  - id: databricks-scd2-with-merge
    deck: Databricks
    question: SCD2 with MERGE?
    answer: Stage changes, close the current row (end_date, is_current=false), insert the new version. Or use APPLY CHANGES ... STORED AS SCD TYPE 2.
    topic: databricks/merge-scd1-scd2-cdc
    min_level: inherit
    order: 6
  - id: databricks-unity-catalog-model
    deck: Databricks
    question: Unity Catalog model?
    answer: Metastore → catalog → schema → table/volume/function. Storage credential + external location for external data. Grants inherit downward. Built-in lineage and audit.
    topic: databricks/catalogs
    min_level: inherit
    order: 7
  - id: databricks-row-column-security
    deck: Databricks
    question: Row/column security?
    answer: Row filters and column masks (SQL functions bound to tables) are preferred over dynamic views.
    topic: databricks/row-level-security
    min_level: inherit
    order: 8
  - id: databricks-auto-loader
    deck: Databricks
    question: Auto Loader?
    answer: cloudFiles incremental ingest. File notification mode scales better than directory listing. Uses schemaLocation, rescued data column, and checkpoint for file tracking.
    topic: databricks/auto-loader
    min_level: inherit
    order: 9
  - id: databricks-exactly-once-in-streaming
    deck: Databricks
    question: Exactly-once in streaming?
    answer: Replayable source + checkpointed offsets + idempotent or transactional sink. In foreachBatch use MERGE or txnAppId/txnVersion.
    topic: databricks/exactly-once-processing
    min_level: inherit
    order: 10
  - id: databricks-declarative-pipelines
    deck: Databricks
    question: Declarative Pipelines?
    answer: Declare streaming tables and materialized views; dependencies and orchestration are automatic. Expectations warn, drop or fail on bad rows.
    topic: databricks/lakeflow-declarative-pipelines
    min_level: inherit
    order: 11
  - id: databricks-jobs-compute-choices
    deck: Databricks
    question: Jobs compute choices?
    answer: Job clusters are cheaper and isolated; serverless removes startup; repair runs rerun failed tasks only; cluster policies cap cost.
    topic: databricks/jobs
    min_level: inherit
    order: 12
  - id: pyspark-handle-data-skew
    deck: PySpark
    question: Handle data skew?
    answer: AQE skew join, broadcast the small side, salting hot keys, repartition on a better key.
    topic: pyspark/data-skew-handling
    min_level: inherit
    order: 13
  - id: pyspark-join-strategies
    deck: PySpark
    question: Join strategies?
    answer: Broadcast hash (small side), sort-merge (default for large), shuffle hash. Check with explain().
    topic: pyspark/joins-and-broadcast
    min_level: inherit
    order: 14
  - id: pyspark-repartition-vs-coalesce
    deck: PySpark
    question: repartition vs coalesce?
    answer: repartition = full shuffle, any count. coalesce = narrow, reduce only, can create uneven partitions.
    topic: pyspark/shuffle-and-partitioning
    min_level: inherit
    order: 15
  - id: pyspark-why-avoid-python-udfs
    deck: PySpark
    question: Why avoid Python UDFs?
    answer: Row-by-row serialization to Python. Prefer built-ins, then pandas UDFs (Arrow batches).
    topic: pyspark/udfs-and-pandas-udfs
    min_level: inherit
    order: 16
  - id: pyspark-read-the-spark-ui
    deck: PySpark
    question: Read the Spark UI?
    answer: Long-tail tasks = skew. Spill = memory pressure. Thousands of tiny tasks = small files. Big shuffle read/write = wide transform to rethink.
    topic: pyspark/spark-ui-debugging
    min_level: inherit
    order: 17
  - id: pyspark-watermark
    deck: PySpark
    question: Watermark?
    answer: Bounds streaming state; events later than the watermark are dropped from stateful ops.
    topic: pyspark/structured-streaming
    min_level: inherit
    order: 18
  - id: aws-data-lake-layout-on-s3
    deck: AWS
    question: Data lake layout on S3?
    answer: Partition by query pattern, columnar formats (Parquet/Iceberg/Delta), lifecycle tiers, SSE-KMS, strong read-after-write consistency.
    topic: aws/s3
    min_level: inherit
