  - id: aws-glue-vs-emr-vs-databricks
    deck: AWS
    question: Glue vs EMR vs Databricks?
    answer: "Glue: serverless simple ETL. EMR: control and cost at scale. Databricks: Delta, governance, collaboration, ML."
