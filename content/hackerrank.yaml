disclaimer: Based on public HackerRank release notes and candidate reports; confirm your company's exact format with the recruiter.
sections:
  - id: what-is-new
    title: What is new
    body: An AI assistant is enabled in the interview IDE or code repo. Interviewers can watch your AI interactions in real time, and reports can include an AI-fluency grade. You may be able to choose when to share the problem statement with the assistant. Data roles can use notebooks/VS Code with AI chat. Some rounds are AI-run, conversational resume deep dives.
    order: 1
  - id: task-shapes-reported
    title: Task shapes reported
    body: Debug-and-fix tasks, implementing a feature against visible test cases (e.g. discount coupons), classic stdin/stdout coding, system design, and resume deep dive.
    order: 2
  - id: how-to-behave
    title: How to behave
    body: Spend the first minutes reading the repo and tests. State your plan before prompting. Ask the AI for ideas or snippets, not the whole solution. Read and run everything it writes. Say what you accepted, changed or rejected and why. Cover edge cases and complexity out loud.
    order: 3
  - id: format-risk
    title: Format risk
    body: Tests are customizable and one candidate reported a round not matching the format they were told. Ask the recruiter for the exact round formats, tools allowed and duration.
    order: 4
