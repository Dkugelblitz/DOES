# Generated by scripts/build-seed.mjs from scripts/legacy/*. Initial seed only:
# after seeding, edit content in the admin console (versioned in the database).
progress:
  default_hours_per_topic: 3
  default_hours_per_day: 2
  in_progress_weight: 0.4
  subtopics_drive_status: true
resources:
  kinds:
    - Link
    - Article
    - Video
    - Doc
  max_excerpt_chars: 20000
uploads:
  allowed_types:
    - image/jpeg
    - image/png
    - image/webp
    - image/heic
    - application/pdf
  max_image_bytes: 5242880
  client_compress_images_to_px: 1600
  max_pdf_bytes: 10485760
  per_user_quota_bytes: 26214400
  signed_url_ttl_seconds: 3600
  thumbnails: client-side at upload (no paid image transforms)
summary:
  engine: extractive
  max_points: 4
  min_sentence_chars: 25
