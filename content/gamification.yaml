# Generated by scripts/build-seed.mjs from scripts/legacy/*. Initial seed only:
# after seeding, edit content in the admin console (versioned in the database).
xp:
  topic_done:
    points: 30
    idempotency_key: topic_done:{topic_id}
    note: Once per topic, ever. Un-marking and re-marking done gives no extra XP.
  revision:
    points: 10
    idempotency_key: revision:{topic_id}:{cycle}
    only_when_due: true
  note:
    points: 5
    idempotency_key: note:{topic_id}
    min_chars: 20
  attachment:
    points: 5
    idempotency_key: attachment:{topic_id}
  study_minute:
    points: 1
    idempotency_key: session:{session_id}
    min_session_minutes: 1
    max_session_minutes: 240
levels:
  formula: min(max_level, floor(sqrt(xp / divisor)) + 1)
  divisor: 40
  max_level: 7
  titles:
    - level: 1
      title: Rookie
      min_xp: 0
    - level: 2
      title: Pipeline Builder
      min_xp: 40
    - level: 3
      title: Lakehouse Engineer
      min_xp: 160
    - level: 4
      title: Spark Tamer
      min_xp: 360
    - level: 5
      title: Senior Craftsperson
      min_xp: 640
    - level: 6
      title: Principal Mind
      min_xp: 1000
    - level: 7
      title: Architect Legend
      min_xp: 1440
streak:
  day_boundary: profile_timezone
  counts_as_activity:
    - topic_done
    - revision
    - note
    - attachment
    - study_session
  today_optional: true
revision:
  due_after_days: 5
  overdue_after_days: 7
  clock_starts: max(done_at, last_revised_at)
badges:
  - id: first-topic
    name: First topic
    icon: 🌱
    rule:
      type: topics_done
      gte: 1
    order: 1
  - id: 3-day-streak
    name: 3-day streak
    icon: 🔥
    rule:
      type: streak_days
      gte: 3
    order: 2
  - id: 7-day-streak
    name: 7-day streak
    icon: ⚡
    rule:
      type: streak_days
      gte: 7
    order: 3
  - id: 10-topics
    name: 10 topics
    icon: 📚
    rule:
      type: topics_done
      gte: 10
    order: 4
  - id: 25-topics
    name: 25 topics
    icon: 🏔️
    rule:
      type: topics_done
      gte: 25
    order: 5
  - id: 50-topics
    name: 50 topics
    icon: 🏆
    rule:
      type: topics_done
      gte: 50
    order: 6
  - id: 10-hours
    name: 10 hours
    icon: ⏱️
    rule:
      type: study_minutes
      gte: 600
    order: 7
  - id: 50-hours
    name: 50 hours
    icon: ⏳
    rule:
      type: study_minutes
      gte: 3000
    order: 8
  - id: 5-notes
    name: 5 notes
    icon: 📝
    rule:
      type: notes_count
      gte: 5
    order: 9
  - id: 5-revisions
    name: 5 revisions
    icon: 🔁
    rule:
      type: revisions_count
      gte: 5
    order: 10
  - id: pareto-pro
    name: Pareto Pro
    icon: 🎯
    rule:
      type: pareto_complete
      scope: any_held_level
    order: 11
  - id: night-owl
    name: Night owl
    icon: 🌙
    rule:
      type: session_start_local_hour
      from: 22
      to: 4
    order: 12
  - id: early-bird
    name: Early bird
    icon: 🌅
    rule:
      type: session_start_local_hour
      from: 5
      to: 8
    order: 13
